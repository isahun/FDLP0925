<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="Mòdul, exercicis o apunts, temes">

  <title></title>

<body>

  <div id="createPilot-div" style="margin-top: 15px;">
    <label for="nomPilot">Nom del pilot:</label> <input type="text" id="nomPilot"><br>
    <label for="cognomPilot">Cognom del pilot:</label> <input type="text" id="cognomPilot"><br>
    <label for="edatPilot">Edat del pilot:</label> <input type="number" id="edatPilot"><br>
    <label for="antiguitatPilot">Antiguitat del pilot:</label> <input type="number" id="antiguitatPilot"><br>
    <label for="alcadaPilot">Alçada del pilot:</label> <input type="number" id="alcadaPilot"><br>
    <label for="pesPilot">Pes del pilot:</label> <input type="number" id="pesPilot"><br>
    <br>
    <p> Tria una escuderia:</p>
    <select name="escuderia" id="escuderiaPilot">
      <option value = "0">Renault</option>
      <option value = "1">McLaren</option>
      <option value = "2">Ferrari</option>
    </select>
  </div>

  <div id="createMechanic-div" style="margin-top: 15px;">
    <label for="nomMecanic">Nom del mecànic:</label> <input type="text" id="nomMecanic"><br>
    <label for="cognomMecanic">Cognom del mecànic:</label> <input type="text" id="cognomMecanic"><br>
    <label for="edatMecanic">Edat del mecànic:</label> <input type="number" id="edatMecanic"><br>
    <label for="antiguitatMecanic">Antiguitat del mecànic:</label> <input type="number" id="antiguitatPilot"><br>
    
    <label for="estudisMecanic">Estudis superiors de mecànica:</label> 
    <select name="estudisMecanic" id="estudisMecanic">
      <option value = "0">Sí</option>
      <option value = "1">No</option>
    </select>
    <br>
    <p> Tria una escuderia:</p>
    <select name="escuderia" id="escuderiaMecanic">
      <option value = "0">Renault</option>
      <option value = "1">McLaren</option>
      <option value = "2">Ferrari</option>
    </select>
  </div>

    <br>
  
    <div id="result"></div>

    <script src="DDBB.js"></script>
    <script src="Escuderia.js"></script>
    <script src="Cotxe.js"></script>
    <script src="Empleat.js"></script>
    <script src="Pilot.js"></script>
    <script src="Mecanic.js"></script>
    <script src="helpers.js"></script>
    <script src="main.js"></script>
</body>

</html>
